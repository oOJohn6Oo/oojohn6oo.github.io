<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CMP 发布</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="header-content"><a class="brand" href="./"><span class="logo" aria-hidden="true">C</span>CMP <span class="muted">/ 发布控制台</span></a></div></header>
<main>
  <div class="layout">
    <form id="config-form">
      <section aria-labelledby="sources-title">
        <div class="section-title"><h2 id="sources-title">源码分支</h2></div>
        <div class="branches" id="branches"></div>
      </section>
      <section aria-labelledby="toggle-dependencies">
        <h2 class="section-title dependency-heading">
          <button type="button" id="toggle-dependencies" aria-expanded="false" aria-controls="dependencies" aria-label="展开依赖">
            <span>依赖版本</span><span id="dependency-state" class="section-value"></span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
          </button>
        </h2>
        <div class="toolbar" role="group" aria-label="设置所有依赖版本">
          <button type="button" id="reset-modes" aria-label="全部使用分支默认" aria-pressed="true">分支默认</button>
          <button type="button" id="latest-modes" aria-label="全部使用最新 release" aria-pressed="false">最新 release</button>
        </div>
        <div id="dependencies" hidden></div>
      </section>
      <section aria-labelledby="release-title">
        <div class="section-title"><h2 id="release-title">发布版本</h2><span class="section-value" title="仅支持 1.12 系列，暂不支持 1.9.2">1.12 系列</span></div>
        <label class="field form-row"><span>版本后缀</span><input id="suffix" placeholder="以数字结尾，如 dev.01" autocomplete="off" maxlength="64" aria-describedby="suffix-message"></label>
        <p class="hint error" id="suffix-message" role="status" hidden></p>
        <div class="version-preview form-row"><span>完整版本</span><strong id="full-version">1.12.0-…</strong></div>
        </section>
      <section aria-labelledby="repository-title">
        <div class="section-title"><h2 id="repository-title">发布仓库</h2></div>
        <label class="field form-row"><span>URL</span><input id="publish-url" type="url" required maxlength="2048" spellcheck="false" autocomplete="off" placeholder="输入 Maven 仓库 HTTPS 地址" aria-describedby="repository-error"></label>
        <label class="field form-row"><span>用户名</span><input id="maven-username" required maxlength="128" autocomplete="off" spellcheck="false" placeholder="Maven 用户名" aria-describedby="repository-error"></label>
        <label class="field form-row"><span>密码</span><input id="maven-password" type="password" required maxlength="1024" autocomplete="off" placeholder="Maven 密码" aria-describedby="repository-error"></label>
        <p id="repository-error" class="hint error" role="status" hidden></p>
      </section>
    </form>
    <aside>
      <div class="summary-card">
        <h2>发布摘要</h2>
        <dl id="summary"></dl>
        <button type="button" disabled class="primary submit" aria-describedby="publish-status">开始发布</button>
        <p class="hint publish-status" id="publish-status">发布功能尚未接入</p>
        <button type="button" id="debug-run" class="debug-button">Debug</button>
        <p id="debug-status" class="hint" role="status"></p>
      </div>
    </aside>
  </div>
</main>
<dialog id="debug-dialog" aria-labelledby="debug-title">
  <form id="debug-form">
    <h2 id="debug-title">Debug</h2>
    <p class="hint">检查源码、版本和编译环境，跳过编译与发布。</p>
    <label class="field"><span>GitHub Token</span><input id="debug-token" type="password" required autocomplete="off" spellcheck="false" placeholder="该构建仓库的 Actions 写入权限"></label>
    <p class="hint">仅用于本次请求，不保存 Token。</p>
    <p id="debug-error" class="hint error" role="alert"></p>
    <div class="debug-actions"><button type="button" id="debug-cancel">取消</button><button type="submit" id="debug-submit">运行 Debug</button></div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
